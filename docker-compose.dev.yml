# Local development dependencies only. Run the app with `npm run dev` and the worker with `npm run worker`.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiup
      POSTGRES_PASSWORD: aiup
      POSTGRES_DB: aiup
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiup -d aiup"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data

  # Catches all outgoing e-mail (magic links!) – UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # --- Media server for meetings (Phase 4). Start with: docker compose -f docker-compose.dev.yml --profile media up -d
  livekit:
    image: livekit/livekit-server:v1.13.5
    profiles: ["media"]
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./deploy/livekit/dev/livekit.yaml:/etc/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  egress:
    image: livekit/egress:v1.14.1
    profiles: ["media"]
    cap_add:
      - SYS_ADMIN
    shm_size: "1gb"
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./deploy/livekit/dev/egress.yaml:/etc/egress.yaml:ro
      - ./data/recordings:/out
    depends_on:
      - redis
      - livekit

volumes:
  pgdata_dev:
  redisdata_dev:
